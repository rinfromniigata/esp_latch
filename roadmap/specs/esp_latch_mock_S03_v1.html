<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>esp_latch モック S03</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== 1. Carbon Design System v11 の既定値（モックで使う分だけ。ライト=g10、ダーク=g100） ===== */
:root, [data-theme="light"] {
  --cds-background: #f4f4f4;
  --cds-layer-01: #ffffff;
  --cds-layer-02: #f4f4f4;
  --cds-layer-hover-01: #e8e8e8;
  --cds-layer-selected-01: #e0e0e0;
  --cds-border-subtle-01: #c6c6c6;
  --cds-border-strong-01: #8d8d8d;
  --cds-text-primary: #161616;
  --cds-text-secondary: #525252;
  --cds-text-on-color: #ffffff;
  --cds-text-disabled: rgba(22,22,22,.25);
  --cds-icon-primary: #161616;
  --cds-icon-secondary: #525252;
  --cds-interactive: #0f62fe;
  --cds-focus: #0f62fe;
  --cds-link-primary: #0f62fe;
  --cds-button-primary: #0f62fe;
  --cds-button-primary-hover: #0050e6;
  --cds-button-primary-active: #002d9c;
  --cds-button-secondary: #393939;
  --cds-button-secondary-hover: #474747;
  --cds-button-disabled: #c6c6c6;
  --cds-field-01: #ffffff;
  --cds-highlight: #d0e2ff;
  --cds-support-error: #da1e28;
  --cds-support-warning: #f1c21b;
  --cds-overlay: rgba(22,22,22,.5);
  --cds-shadow: rgba(0,0,0,.3);
  --cds-spacing-02: 4px;
  --cds-spacing-03: 8px;
  --cds-spacing-04: 12px;
  --cds-spacing-05: 16px;
  --cds-spacing-06: 24px;
  --cds-spacing-07: 32px;
  --cds-duration-fast-02: 110ms;
  --cds-easing-productive: cubic-bezier(0.2, 0, 0.38, 0.9);
}
[data-theme="dark"] {
  --cds-background: #161616;
  --cds-layer-01: #262626;
  --cds-layer-02: #393939;
  --cds-layer-hover-01: #333333;
  --cds-layer-selected-01: #393939;
  --cds-border-subtle-01: #393939;
  --cds-border-strong-01: #6f6f6f;
  --cds-text-primary: #f4f4f4;
  --cds-text-secondary: #c6c6c6;
  --cds-text-on-color: #ffffff;
  --cds-text-disabled: rgba(244,244,244,.25);
  --cds-icon-primary: #f4f4f4;
  --cds-icon-secondary: #c6c6c6;
  --cds-interactive: #4589ff;
  --cds-focus: #ffffff;
  --cds-link-primary: #78a9ff;
  --cds-button-primary: #0f62fe;
  --cds-button-primary-hover: #0050e6;
  --cds-button-primary-active: #002d9c;
  --cds-button-secondary: #6f6f6f;
  --cds-button-secondary-hover: #5e5e5e;
  --cds-button-disabled: #393939;
  --cds-field-01: #262626;
  --cds-highlight: #002d9c;
  --cds-support-error: #fa4d56;
  --cds-support-warning: #f1c21b;
  --cds-overlay: rgba(0,0,0,.65);
  --cds-shadow: rgba(0,0,0,.8);
}

/* ===== 2. ブランドトークン（esp_latch_tokens.css の写し。1を上書きする） ===== */
/* esp_latch ブランドトークン（確定）
   Carbon Design System v11（@carbon/web-components 2.x）のテーマを上書きする値だけを持つ。
   ライトは g10、ダークは g100 を土台にする。各値の右のコメントは、上書きする Carbon の既定値。
   Carbon にない項目（書体の切り替え・角丸・マウント状態色・帯グラフの色）は --esp- 接頭辞で持つ */

:root {
  /* 書体（ロケールごとに切り替える）。Carbon既定：IBM Plex Sans / IBM Plex Mono（@carbon/type） */
  --esp-font-sans: "IBM Plex Sans", -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
  --esp-font-mono: "IBM Plex Mono", "SF Mono", Menlo, monospace;

  /* 角丸：Carbon既定は 0（部品は角） */
  --esp-radius-sm: 2px; /* ボタン・入力・タグ以外の小部品 */
  --esp-radius-md: 4px; /* タイル・モーダル */
}

:root:lang(ja) {
  --esp-font-sans: "IBM Plex Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
}
:root:lang(zh-Hans) {
  --esp-font-sans: "IBM Plex Sans", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
}

/* ライト（g10を上書き） */
:root,
[data-theme="light"] {
  --cds-background: #f4f5f7;           /* g10: #f4f4f4 */
  --cds-layer-01: #ffffff;             /* g10: #ffffff */
  --cds-layer-02: #eef0f3;             /* g10: #f4f4f4 */
  --cds-layer-hover-01: #e9ecf0;       /* g10: #e8e8e8 */
  --cds-layer-selected-01: #dfe4ea;    /* g10: #e0e0e0 */
  --cds-border-subtle-01: #d0d4da;     /* g10: #c6c6c6 */
  --cds-border-strong-01: #8a94a3;     /* g10: #8d8d8d */
  --cds-text-primary: #1b1f24;         /* g10: #161616 */
  --cds-text-secondary: #5b6470;       /* g10: #525252 */
  --cds-icon-primary: #1b1f24;         /* g10: #161616 */
  --cds-icon-secondary: #5b6470;       /* g10: #525252 */
  --cds-interactive: #1f6fd1;          /* g10: #0f62fe */
  --cds-focus: #1f6fd1;                /* g10: #0f62fe */
  --cds-link-primary: #1f6fd1;         /* g10: #0f62fe */
  --cds-button-primary: #1f6fd1;       /* g10: #0f62fe */
  --cds-button-primary-hover: #1a5fb4; /* g10: #0050e6 */
  --cds-button-primary-active: #154c91;/* g10: #002d9c */
  --cds-highlight: #dbe8f8;            /* g10: #d0e2ff */
  --cds-support-error: #c4392d;        /* g10: #da1e28 */
  --esp-state-mounted: #0f8a7e;        /* 独自：マウント中の文字・枠・帯 */
  --esp-state-mounted-bg: #d8f0ed;     /* 独自：マウント中のタグ背景 */
  --esp-part-esp: #1f6fd1;             /* 独自：帯グラフのESP */
  --esp-part-apfs: #8a94a3;            /* 独自：帯グラフのAPFS */
  --esp-part-hfs: #a9b1bd;             /* 独自：帯グラフのHFS+ */
  --esp-part-other: #c9ced6;           /* 独自：帯グラフのその他 */
}

/* ダーク（g100を上書き） */
[data-theme="dark"] {
  --cds-background: #15181d;           /* g100: #161616 */
  --cds-layer-01: #1d2127;             /* g100: #262626 */
  --cds-layer-02: #262b33;             /* g100: #393939 */
  --cds-layer-hover-01: #2a3038;       /* g100: #333333 */
  --cds-layer-selected-01: #313843;    /* g100: #393939 */
  --cds-border-subtle-01: #343a44;     /* g100: #393939 */
  --cds-border-strong-01: #6b7584;     /* g100: #6f6f6f */
  --cds-text-primary: #e6e9ee;         /* g100: #f4f4f4 */
  --cds-text-secondary: #9aa3af;       /* g100: #c6c6c6 */
  --cds-icon-primary: #e6e9ee;         /* g100: #f4f4f4 */
  --cds-icon-secondary: #9aa3af;       /* g100: #c6c6c6 */
  --cds-interactive: #5b9df0;          /* g100: #4589ff */
  --cds-focus: #e6e9ee;                /* g100: #ffffff */
  --cds-link-primary: #7fb3f5;         /* g100: #78a9ff */
  --cds-button-primary: #2f7ad8;       /* g100: #0f62fe */
  --cds-button-primary-hover: #3a86e6; /* g100: #0050e6 */
  --cds-button-primary-active: #2464b5;/* g100: #002d9c */
  --cds-highlight: #1d3352;            /* g100: #002d9c */
  --cds-support-error: #f0786b;        /* g100: #fa4d56 */
  --esp-state-mounted: #3cc4b3;        /* 独自 */
  --esp-state-mounted-bg: #143a36;     /* 独自 */
  --esp-part-esp: #5b9df0;             /* 独自 */
  --esp-part-apfs: #6b7584;            /* 独自 */
  --esp-part-hfs: #58616e;             /* 独自 */
  --esp-part-other: #454c57;           /* 独自 */
}

/* ===== モックの共通スタイル（値はすべてカスタムプロパティ経由） ===== */
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--cds-background); color: var(--cds-text-primary);
  font-family: var(--esp-font-sans); font-size: 14px; line-height: 1.43;
}
.mono { font-family: var(--esp-font-mono); }
.muted { color: var(--cds-text-secondary); }

/* モックの外側（評価用の枠。アプリのUIではない） */
.mock-bar { position: sticky; top: 0; z-index: 50; display: flex; gap: var(--cds-spacing-05); align-items: center; flex-wrap: wrap;
  padding: var(--cds-spacing-03) var(--cds-spacing-06); background: var(--cds-layer-02); border-bottom: 1px solid var(--cds-border-subtle-01); font-size: 12px; }
.mock-bar strong { font-weight: 600; }
.mock-bar .grp { display: flex; gap: var(--cds-spacing-02); align-items: center; }
.mock-bar button { font: inherit; padding: 2px 10px; border: 1px solid var(--cds-border-strong-01); background: var(--cds-layer-01); color: var(--cds-text-primary); border-radius: var(--esp-radius-sm); cursor: pointer; }
.mock-bar button[aria-pressed="true"] { background: var(--cds-interactive); color: var(--cds-text-on-color); border-color: var(--cds-interactive); }
.mock-wrap { max-width: 1240px; margin: 0 auto; padding: var(--cds-spacing-06); }
.mock-intro { padding: var(--cds-spacing-05); border-left: 3px solid var(--cds-interactive); background: var(--cds-layer-01); margin-bottom: var(--cds-spacing-07); }
.mock-intro p { margin: 4px 0; }
section[data-screen] { margin-bottom: 56px; }
.screen-head { display: flex; align-items: baseline; gap: var(--cds-spacing-04); margin: 0 0 var(--cds-spacing-04); }
.screen-head h2 { margin: 0; font-size: 20px; font-weight: 600; }
.screen-head .sid { font-family: var(--esp-font-mono); color: var(--cds-text-secondary); }
.state { margin: var(--cds-spacing-07) 0 var(--cds-spacing-04); }
.state h3 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
.state h3 .sid { font-family: var(--esp-font-mono); color: var(--cds-text-secondary); margin-right: 8px; }
.state p.note { margin: 0 0 var(--cds-spacing-04); color: var(--cds-text-secondary); font-size: 13px; }
.compare { display: grid; grid-template-columns: 1fr; gap: var(--cds-spacing-06); }
.compare-label { font-weight: 600; margin-bottom: 6px; }
.compare-label .tagline { font-weight: 400; color: var(--cds-text-secondary); margin-left: 8px; }

/* ===== macOSのウィンドウ枠 ===== */
.win { width: 1100px; max-width: 100%; height: 720px; margin: 0 auto; display: flex; flex-direction: column; overflow: hidden;
  background: var(--cds-background); border: 1px solid var(--cds-border-subtle-01); border-radius: 10px; box-shadow: 0 12px 40px var(--cds-shadow); position: relative; }
.win.small { width: 640px; height: auto; }
.titlebar { height: 44px; flex: none; display: flex; align-items: center; gap: var(--cds-spacing-04); padding: 0 var(--cds-spacing-04) 0 var(--cds-spacing-05);
  background: var(--cds-layer-01); border-bottom: 1px solid var(--cds-border-subtle-01); }
.lights { display: flex; gap: 8px; width: 60px; flex: none; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; display: block; }
.lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
.titlebar .appname { font-weight: 600; font-size: 13px; }
.titlebar .spacer { flex: 1; }

/* ===== Carbonの部品（見た目の写し） ===== */
.btn { font: inherit; font-size: 13px; height: 32px; padding: 0 var(--cds-spacing-05); display: inline-flex; align-items: center; gap: var(--cds-spacing-03);
  border: 1px solid transparent; border-radius: var(--esp-radius-sm); cursor: pointer; white-space: nowrap;
  transition: background var(--cds-duration-fast-02) var(--cds-easing-productive); }
.btn svg { width: 16px; height: 16px; fill: currentColor; flex: none; }
.btn-primary { background: var(--cds-button-primary); color: var(--cds-text-on-color); }
.btn-primary:hover, .btn-primary.is-hover { background: var(--cds-button-primary-hover); }
.btn-secondary { background: var(--cds-button-secondary); color: var(--cds-text-on-color); }
.btn-secondary:hover, .btn-secondary.is-hover { background: var(--cds-button-secondary-hover); }
.btn-tertiary { background: transparent; color: var(--cds-interactive); border-color: var(--cds-interactive); }
.btn-tertiary:hover, .btn-tertiary.is-hover { background: var(--cds-interactive); color: var(--cds-text-on-color); }
.btn-ghost { background: transparent; color: var(--cds-link-primary); padding: 0 var(--cds-spacing-04); }
.btn-ghost:hover, .btn-ghost.is-hover { background: var(--cds-layer-hover-01); }
.btn-icon { width: 32px; padding: 0; justify-content: center; color: var(--cds-icon-primary); background: transparent; }
.btn-icon:hover, .btn-icon.is-hover { background: var(--cds-layer-hover-01); }
.btn:focus-visible, .btn.is-focus { outline: 2px solid var(--cds-focus); outline-offset: -2px; box-shadow: inset 0 0 0 3px var(--cds-layer-01); }
.btn[disabled], .btn.is-disabled { background: var(--cds-button-disabled); color: var(--cds-text-disabled); border-color: transparent; cursor: not-allowed; }
.btn-tertiary[disabled] { background: transparent; border-color: var(--cds-button-disabled); }
.btn-ghost[disabled] { background: transparent; }

.switcher { display: flex; border: 1px solid var(--cds-border-strong-01); border-radius: var(--esp-radius-sm); overflow: hidden; height: 32px; }
.switcher button { font: inherit; font-size: 12px; flex: 1 1 auto; border: 0; border-right: 1px solid var(--cds-border-subtle-01); background: var(--cds-layer-01); color: var(--cds-text-secondary); padding: 0 var(--cds-spacing-04); cursor: pointer; white-space: nowrap; }
.switcher button:last-child { border-right: 0; }
.switcher button[aria-selected="true"] { background: var(--cds-text-primary); color: var(--cds-layer-01); }

.tag { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px; border-radius: 10px; font-size: 12px; white-space: nowrap;
  background: var(--cds-layer-selected-01); color: var(--cds-text-primary); }
.tag.mounted { background: var(--esp-state-mounted-bg); color: var(--esp-state-mounted); }
.tag.mounted::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.tag.esp { background: var(--cds-highlight); color: var(--cds-link-primary); }
.tag.boot { background: transparent; border: 1px solid var(--cds-border-strong-01); color: var(--cds-text-secondary); }
.tag.boot svg { width: 12px; height: 12px; fill: currentColor; }

.toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.toggle .track { width: 48px; height: 24px; border-radius: 12px; background: var(--cds-border-strong-01); position: relative; flex: none; }
.toggle .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--cds-layer-01); transition: left var(--cds-duration-fast-02) var(--cds-easing-productive); }
.toggle.on .track { background: var(--esp-state-mounted); }
.toggle.on .track::after { left: 27px; }

.select { position: relative; height: 32px; min-width: 200px; display: inline-flex; align-items: center; padding: 0 36px 0 var(--cds-spacing-05);
  background: var(--cds-field-01); border-bottom: 1px solid var(--cds-border-strong-01); font-size: 13px; }
.select::after { content: ""; position: absolute; right: 14px; top: 12px; border: 5px solid transparent; border-top-color: var(--cds-icon-primary); }

.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th { text-align: left; font-weight: 600; background: var(--cds-layer-selected-01); padding: 6px var(--cds-spacing-05); height: 32px; white-space: nowrap; }
.table td { padding: 6px var(--cds-spacing-05); border-top: 1px solid var(--cds-border-subtle-01); height: 32px; }
.table tr:hover td { background: var(--cds-layer-hover-01); }
.table td.num, .table th.num { text-align: right; }

.notif { display: flex; gap: var(--cds-spacing-04); align-items: flex-start; padding: var(--cds-spacing-04) var(--cds-spacing-05); background: var(--cds-layer-01);
  border-left: 3px solid var(--esp-state-mounted); box-shadow: 0 2px 8px var(--cds-shadow); max-width: 440px; font-size: 13px; }
.notif.error { border-left-color: var(--cds-support-error); }
.notif .ic { width: 20px; height: 20px; flex: none; fill: var(--esp-state-mounted); }
.notif.error .ic { fill: var(--cds-support-error); }
.notif .ttl { font-weight: 600; }
.notif .body { margin-top: 2px; }
.notif .actions { margin-top: var(--cds-spacing-03); display: flex; gap: var(--cds-spacing-03); }
.notif .cmd { margin-top: 6px; font-family: var(--esp-font-mono); font-size: 12px; color: var(--cds-text-secondary); word-break: break-all; }
.toast-layer { position: absolute; right: var(--cds-spacing-05); bottom: 44px; display: flex; flex-direction: column; gap: var(--cds-spacing-03); z-index: 5; }

.modal-layer { position: absolute; inset: 44px 0 0 0; background: var(--cds-overlay); display: flex; align-items: center; justify-content: center; z-index: 6; }
.modal { width: 460px; max-width: 90%; background: var(--cds-layer-01); border-radius: var(--esp-radius-md); overflow: hidden; }
.modal .hd { padding: var(--cds-spacing-05) var(--cds-spacing-05) 0; }
.modal .hd .lbl { font-size: 12px; color: var(--cds-text-secondary); }
.modal .hd h4 { margin: 2px 0 0; font-size: 18px; font-weight: 500; overflow-wrap: anywhere; }
.modal .bd { padding: var(--cds-spacing-04) var(--cds-spacing-05) var(--cds-spacing-07); font-size: 14px; }
.modal .ft { display: flex; }
.modal .ft .btn { flex: 1; height: 56px; border-radius: 0; align-items: flex-start; padding-top: 14px; }

.skeleton { background: var(--cds-layer-selected-01); border-radius: var(--esp-radius-sm); animation: pulse 1.4s var(--cds-easing-productive) infinite; }
@keyframes pulse { 50% { opacity: .45; } }
.spinner { width: 16px; height: 16px; border: 2px solid var(--cds-border-subtle-01); border-top-color: var(--cds-interactive); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== アプリの画面 ===== */
.body-row { flex: 1; display: flex; min-height: 0; }
.sidebar { width: 300px; flex: none; display: flex; flex-direction: column; background: var(--cds-layer-01); border-right: 1px solid var(--cds-border-subtle-01); min-height: 0; }
.sidebar .sb-head { padding: var(--cds-spacing-05) var(--cds-spacing-05) var(--cds-spacing-04); display: flex; flex-direction: column; gap: var(--cds-spacing-04); }
.sb-title { display: flex; justify-content: space-between; align-items: baseline; font-weight: 600; font-size: 13px; }
.sb-title .muted { font-weight: 400; font-size: 12px; }
.devlist { flex: 1; overflow: auto; }
.dev { display: flex; gap: var(--cds-spacing-04); padding: var(--cds-spacing-04) var(--cds-spacing-05); border-top: 1px solid var(--cds-border-subtle-01); cursor: pointer; position: relative; }
.dev:hover { background: var(--cds-layer-hover-01); }
.dev.sel { background: var(--cds-layer-selected-01); }
.dev.sel::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--cds-interactive); }
.dev .di { width: 24px; height: 24px; flex: none; fill: var(--cds-icon-secondary); margin-top: 2px; }
.dev .dn { font-weight: 500; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dev .dm { font-size: 12px; color: var(--cds-text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dev .dt { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
.dev .txt { min-width: 0; flex: 1; }
.more { font-size: 11px; font-weight: 400; color: var(--cds-text-secondary); }
.dhead .vendor { font-size: 13px; color: var(--cds-text-secondary); margin-top: 2px; }
.minibar { display: flex; height: 4px; margin-top: 6px; gap: 1px; }
.minibar span { display: block; height: 100%; }

.main { flex: 1; overflow: auto; padding: var(--cds-spacing-06); display: flex; flex-direction: column; gap: var(--cds-spacing-06); min-width: 0; }
.dhead { display: flex; gap: var(--cds-spacing-05); align-items: flex-start; }
.dhead .di { width: 40px; height: 40px; fill: var(--cds-icon-secondary); flex: none; }
.dhead h1 { margin: 0; font-size: 20px; font-weight: 500; overflow-wrap: anywhere; }
.dhead .meta { display: flex; flex-wrap: wrap; gap: 4px var(--cds-spacing-06); margin-top: 6px; font-size: 12px; }
.dhead .meta div span:first-child { color: var(--cds-text-secondary); margin-right: 6px; }

    s.toast = { kind: "error", title: t("toast.mount_failed.title"), body: "Volume on disk4s1 failed to mount; if it has a partitioning scheme, use \"diskutil mountDisk\"", cmd: "diskutil mount disk4s1", actions: ["toast.retry", "toast.show_log"] };
    s.lastCmd = "diskutil mount disk4s1"; s.privileged = true;
  }
  if (state === "eject_confirm") { s.sel = "disk2"; s.modal = "eject"; s.privileged = true; }
  if (state === "many") { s.sel = "disk10"; }
  if (state === "trash" || state === "trash_emptied") {
    s.sel = "disk2"; s.privileged = true;
    const p = find("disk2").parts[0]; p.mounted = "/Volumes/EFI"; p.loader = "OpenCore 1.0.7"; p.used = 43.6 * M; p.trash = state === "trash" ? 151.2 * M : 0;
    s.lastCmd = "diskutil mount disk2s1";
    if (state === "trash_emptied") {
      s.toast = { kind: "ok", title: t("toast.trash_emptied.title"), body: t("toast.trash_emptied.body", { id: "disk2s1", size: size(151.2 * M) }), actions: [] };
      s.lastCmd = "rm -rf /Volumes/EFI/.Trashes";
    }
  }
  return s;
}

/* ===== 描画 ===== */
function kindIcon(d) { return IC[d.kind]; }
function espCount(d) { return d.parts.filter(p => p.type === "esp").length; }
function mountedEsp(d) { return d.parts.filter(p => p.type === "esp" && p.mounted).length; }
function applyFilter(devs, f) {
  if (f === "physical") return devs.filter(d => d.kind !== "image");
  if (f === "esp") return devs.filter(d => espCount(d) > 0);
  return devs;
}
function titlebar() {
  return `<div class="titlebar"><div class="lights"><i></i><i></i><i></i></div><span class="appname">${t("app.name")}</span><span class="spacer"></span>
    <button class="btn btn-icon" title="${esc(t("toolbar.refresh"))}">${IC.refresh}</button>
    <button class="btn btn-icon" title="${esc(t("toolbar.log"))}">${IC.log}</button>
    <button class="btn btn-icon" title="${esc(t("toolbar.settings"))}">${IC.settings}</button></div>`;
}
function switcher(s) {
  return `<div class="switcher" role="tablist">${["all", "esp", "physical"].map(f => `<button data-filter="${f}" aria-selected="${s.filter === f}">${t("filter." + f)}</button>`).join("")}</div>`;
}
function tags(d) {
  const n = espCount(d), m = mountedEsp(d);
  let h = `<span class="tag">${t("device.kind." + d.kind)}</span>`;
  h += n ? `<span class="tag esp">${t("device.esp_count", { count: n })}</span>` : `<span class="tag">${t("device.esp_none")}</span>`;
  if (m) h += `<span class="tag mounted">${t("device.mounted_count", { count: m })}</span>`;
  return h;
}
function band(d, withLabels = true) {
  const segs = d.parts.map(p => {
    const cls = p.type + (p.type === "esp" && p.mounted ? " mounted" : "");
    return { cls, grow: Math.max(p.size / d.size, 0.0001), p };
  });
  let h = `<div class="band">${segs.map(x => `<div class="seg ${x.cls}" style="flex:${x.grow} 1 0" title="${esc(x.p.id + " · " + x.p.name + " · " + size(x.p.size))}"></div>`).join("")}</div>`;
  if (withLabels) h += `<div class="band-labels">${segs.map(x => `<span class="${x.p.type === "esp" ? "esp" : ""} mono" style="flex:${x.grow} 1 0">${x.p.type === "esp" || x.grow >= 0.04 ? x.p.id.replace(d.id, "") : ""}</span>`).join("")}</div>`;
  return h;
}
function legend() {
  return `<div class="legend"><span><i style="background:var(--esp-part-esp)"></i>${t("band.legend.esp")}</span><span><i style="background:var(--esp-state-mounted)"></i>${t("band.legend.mounted")}</span><span><i style="background:var(--esp-part-apfs)"></i>${t("band.legend.apfs")}</span><span><i style="background:var(--esp-part-hfs)"></i>${t("band.legend.hfs")}</span><span><i style="background:var(--esp-part-other)"></i>${t("band.legend.other")}</span><span>· ${t("band.note")}</span></div>`;
}
function espButtons(p, s) {
  if (s.busy === p.id) return `<button class="btn btn-primary" disabled><span class="spinner"></span>${t("esp.working")}</button>`;
  if (p.mounted && p.trash > 0) return `<button class="btn btn-secondary">${IC.eject}${t("esp.empty_trash_unmount")}</button><button class="btn btn-ghost">${IC.trash}${t("esp.empty_trash")}</button><button class="btn btn-ghost">${IC.folder}${t("esp.open_finder")}</button>`;
  if (p.mounted) return `<button class="btn btn-secondary">${IC.eject}${t("esp.unmount")}</button><button class="btn btn-ghost">${IC.folder}${t("esp.open_finder")}</button>`;

}
function espTile(p, s) {
  const st = p.mounted ? `<span class="tag mounted">${t("esp.state.mounted")}</span>` : `<span class="tag">${t("esp.state.unmounted")}</span>`;
  const boot = p.boot ? `<span class="tag boot">${IC.boot}${t("esp.boot_badge")}</span>` : "";

    <div class="row1"><div><div class="id">${p.id}</div><div class="nm">${esc(p.name)}</div></div><div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end">${boot}${st}</div></div>
    <dl class="kv"><dt>${t("esp.size")}</dt><dd class="mono">${size(p.size)}</dd><dt>${t("esp.format")}</dt><dd class="mono">${p.fs}</dd>
      <dt>${t("esp.mount_point")}</dt><dd class="mono">${p.mounted ? esc(p.mounted) : t("table.not_mounted")}</dd><dt>${t("esp.loader")}</dt><dd>${loader}</dd>
      <dt>${t("esp.free")}</dt><dd>${p.mounted ? capacity(p) : `<span class="muted">${t("esp.free_unknown")}</span>`}</dd>
      ${p.mounted ? `<dt>${t("esp.trash")}</dt><dd class="mono">${p.trash > 0 ? size(p.trash) : `<span class="muted">${t("esp.trash_none")}</span>`}</dd>` : ""}</dl>
    ${p.mounted && p.trash > 0 ? `<div class="inline-warn">${IC.warn}<span>${esc(t("esp.trash_warning", { size: size(p.trash) }))}</span></div>` : ""}
    <div class="acts">${espButtons(p, s)}</div></div>`;
}
function capacity(p) {
  const used = p.used ?? 0, trash = p.trash ?? 0, free = Math.max(p.size - used - trash, 0);
  const pct = x => (x / p.size * 100).toFixed(2) + "%";
  return `<span class="mono ${free / p.size < 0.15 ? "low" : ""}">${t("esp.free_of", { free: size(free), total: size(p.size) })}</span>
    <div class="capbar" title="${esc(t("esp.usage.used") + " " + size(used) + " · " + t("esp.usage.trash") + " " + size(trash) + " · " + t("esp.usage.free") + " " + size(free))}"><span class="u" style="width:${pct(used)}"></span><span class="tr" style="width:${pct(trash)}"></span></div>
    <div class="caplegend"><span><i class="u"></i>${t("esp.usage.used")}</span><span><i class="tr"></i>${t("esp.usage.trash")}</span><span><i class="f"></i>${t("esp.usage.free")}</span></div>`;
}
function otherTable(d, s) {
  const rows = d.parts.filter(p => p.type !== "esp");
  if (!rows.length) return "";
  const mp = m => m ? esc(m) : t("table.not_mounted");

      if (open) {
        h += `<tr class="tree-child l1"><td class="mono">${p.container.id}</td><td>${t("other.container_label")}</td><td class="mono">APFS</td><td class="num mono">${size(p.container.size)}</td><td class="mono">${t("table.not_mounted")}</td></tr>`;
        h += p.container.volumes.map(v => `<tr class="tree-child l2"><td class="mono">${v.id}</td><td>${esc(v.name)}</td><td class="mono">APFS</td><td class="num mono">${t("table.volume_used", { size: size(v.used) })}</td><td class="mono">${mp(v.mounted)}</td></tr>`).join("");

}
function statusbar(s) {

function modal(s, d) {

function labels(d) {
  if (d.kind === "image") return [];
  const out = [];
  for (const p of d.parts) {
    if (p.type === "esp") continue;

function renderMain(s) {

  side += `</div></div>`;

  let main = `<div class="main">`;

  else if (!list.length) main += `<div class="empty">${IC.internal}<h4>${t("empty.no_match.title")}</h4><p>${t("empty.no_match.body", { filter: t("filter.all") })}</p><div style="margin-top:16px"><button class="btn btn-tertiary" data-filter="all">${t("filter.all")}</button></div></div>`;
  else if (!d) main += `<div class="empty">${IC.internal}<h4>${t("empty.select.title")}</h4><p>${t("empty.select.body")}</p></div>`;
  else {

  return `<div class="win">${titlebar()}<div class="body-row">${side}${main}</div>${statusbar(s)}${toast(s)}${modal(s, d)}</div>`;
}

/* ===== 全体の再描画 ===== */
const live = new WeakMap();
function renderAll() {
  document.querySelectorAll("[data-render]").forEach(el => {
    const st = live.get(el) || stateData(el.dataset.state);
    if (!live.has(el)) live.set(el, st);
    el.innerHTML = renderMain(st);
  });
  const put = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = html(); };
  put("settings-win", renderSettings);
  put("log-win", () => renderLog(false));
  put("log-win-empty", () => renderLog(true));
  put("parts", renderParts);
}
document.addEventListener("click", e => {
  const host = e.target.closest("[data-render]");
  if (host) {
    const st = live.get(host);
    const dv = e.target.closest("[data-dev]");
    const fl = e.target.closest("[data-filter]");
    if (dv && st) { st.sel = dv.dataset.dev; renderAll(); }
    if (fl && st) { st.filter = fl.dataset.filter; renderAll(); }
    const tg = e.target.closest("[data-toggle]");
    if (tg && st) { const id = tg.dataset.toggle; st.expanded.has(id) ? st.expanded.delete(id) : st.expanded.add(id); renderAll(); }
  }
  const lb = e.target.closest("[data-lang]");
  if (lb) {
    LANG = lb.dataset.lang; document.documentElement.lang = LANG;
    document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b === lb));
    document.querySelectorAll("[data-render]").forEach(el => live.delete(el));
    renderAll();
  }
  const tb = e.target.closest("[data-theme-set]");
  if (tb) {
    document.documentElement.dataset.theme = tb.dataset.themeSet;
    document.querySelectorAll("[data-theme-set]").forEach(b => b.setAttribute("aria-pressed", b === tb));
  }
});
renderAll();
</script>
</body>
</html>
