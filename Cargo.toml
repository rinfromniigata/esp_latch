[workspace]
resolver = "3"
members = ["src-tauri", "crates/esp_latch_protocol", "crates/esp_latch_helper"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/rinfromniigata/esp_latch"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
lto = true
strip = true
